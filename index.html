<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>昼刻 · 翻页时钟</title>
    <link rel="manifest" href="./public/manifest.webmanifest" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark"></span><span>昼刻</span></div>
        <div class="view-title">专注学习</div>
        <div class="top-actions"><button class="account-btn" id="accountBtn">登录同步</button><button class="icon-btn" id="fullscreenBtn" aria-label="全屏">⛶</button></div>
      </header>

      <div id="todayView">
      <section class="clock-panel" aria-label="翻页时钟">
        <div class="date-wrap"><span id="dateText"></span><span id="lunarHint">今日宜专注</span></div>
        <div class="clock-modes"><button id="clockModeBtn" class="active">当前时间</button><button id="timerModeBtn" disabled>任务倒计时</button></div>
        <div class="clock" id="clock">
          <div class="flip-card"><span id="hour">00</span></div>
          <span class="colon">:</span>
          <div class="flip-card"><span id="minute">00</span></div>
          <div class="seconds"><span id="second">00</span><span id="period">AM</span></div>
        </div>
        <p class="focus-line" id="focusLine">把今天过成喜欢的样子。</p>
        <div class="timer-controls" id="timerControls" hidden>
          <button id="pauseTimer">暂停</button>
          <button id="finishTimerEarly">提前结束</button>
          <button id="abandonTimer">放弃</button>
        </div>
      </section>

      <section class="workspace">
        <article class="card todos-card">
          <div class="section-head">
            <div><p class="eyebrow">TODAY</p><h2>待办倒计时</h2></div>
            <button class="add-btn" id="addTodoBtn">＋ 添加</button>
          </div>
          <div class="progress-row"><span id="progressText">0 / 0 已完成</span><div class="progress-track"><i id="progressBar"></i></div></div>
          <div class="todo-list" id="todoList"></div>
          <div class="empty" id="emptyTodos">还没有待办，给今天一个小目标吧。</div>
        </article>

        <article class="card timeline-card">
          <div class="section-head timeline-head"><div><p class="eyebrow">SCHEDULE</p><h2 id="timelineDateTitle">今日时间轴</h2></div><div class="date-nav"><button id="prevTimelineDay" aria-label="前一天">‹</button><button id="timelineToday">今天</button><button id="nextTimelineDay" aria-label="后一天">›</button></div></div>
          <div class="date-strip" id="dateStrip"></div>
          <div class="timeline" id="timeline"></div>
        </article>
      </section>
      <section class="card week-card">
        <div class="section-head"><div><p class="eyebrow">WEEKLY FOCUS</p><h2 id="weekTitle">本周专注纵览</h2></div><div class="week-actions"><button id="prevWeek">‹</button><button id="thisWeek">本周</button><button id="nextWeek">›</button><button class="secondary-btn" id="openHeatmap">全年热力图</button><button class="add-btn" id="logFocus">＋ 补记专注</button></div></div>
        <div class="week-schedule" id="weekSchedule"></div>
      </section>
      </div>

      <dialog id="heatmapDialog" class="heatmap-dialog">
        <div class="year-heading">
          <div><p class="eyebrow">FOCUS HEATMAP</p><h1><button id="prevYear" aria-label="上一个周期">‹</button><span id="yearTitle"></span><button id="nextYear" aria-label="下一个周期">›</button></h1><p id="heatmapSummary">颜色越深，代表当天的专注时间越长。</p></div>
          <div class="heatmap-actions"><button class="today-btn" id="toggleHeatmapMode">查看年度</button><button class="today-btn" id="closeHeatmap">关闭</button></div>
        </div>
        <div class="year-layout">
          <div class="heatmap-wrap"><div id="monthPanel"><div class="month-weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="month-heatmap" id="monthHeatmap"></div></div><div id="yearPanel" hidden><div class="year-heatmap" id="yearCalendar"></div></div><div class="heatmap-legend"><span>未专注</span><i></i><span>1–45m</span><i></i><span>46–120m</span><i></i><span>120m+</span></div></div>
          <aside class="day-detail">
            <div class="section-head"><div><p class="eyebrow">DAY LOG</p><h2 id="selectedDateTitle"></h2></div><button class="add-btn" id="addSelectedTodo">＋ 记录</button></div>
            <div class="day-summary" id="daySummary"></div>
            <div class="timeline detail-timeline" id="dayTimeline"></div>
            <div class="empty" id="emptyDay">这一天还没有记录。</div>
          </aside>
        </div>
      </dialog>
    </main>

    <dialog id="todoDialog">
      <form id="todoForm" method="dialog">
        <div class="dialog-head"><h2>新建待办</h2><button type="button" class="close-btn" id="closeDialog">×</button></div>
        <label>日期<input id="todoDate" type="date" required /></label>
        <label>待办名称<input id="todoTitle" maxlength="32" placeholder="例如：完成设计稿" required /></label>
        <div class="form-grid">
          <label>开始时间<input id="todoStart" type="time" required /></label>
          <label>专注时长<select id="todoDuration"><option value="25">25 分钟</option><option value="45">45 分钟</option><option value="60">1 小时</option><option value="120">2 小时</option></select></label>
        </div>
        <input id="todoEnd" type="hidden" />
        <label>标签
          <select id="todoTag"><option>专注</option><option>工作</option><option>学习</option><option>生活</option><option>休息</option></select>
        </label>
        <button class="primary-btn" type="submit">加入今天</button>
      </form>
    </dialog>
    <dialog id="accountDialog" class="account-dialog">
      <form id="accountForm">
        <div class="dialog-head"><div><p class="eyebrow">CLOUD SYNC</p><h2>昼刻账号</h2></div><button type="button" class="close-btn" id="closeAccount">×</button></div>
        <p class="account-hint" id="accountHint">使用同一个邮箱登录，即可在网页版和 App 端同步记录。</p>
        <div id="authFields"><label>邮箱<input id="accountEmail" type="email" autocomplete="email" required /></label><label>密码<input id="accountPassword" type="password" autocomplete="current-password" minlength="6" required /></label><div class="auth-actions"><button class="primary-btn" type="submit">登录并同步</button><button class="secondary-btn" type="button" id="signupBtn">注册账号</button></div></div>
        <div id="signedInPanel" hidden><p id="signedInEmail"></p><button class="primary-btn" type="button" id="syncNowBtn">立即同步</button><button class="secondary-btn logout-btn" type="button" id="logoutBtn">退出登录</button></div>
        <p class="sync-status" id="syncStatus"></p>
      </form>
    </dialog>
    <script src="./src/cloud-config.js"></script>
    <script src="./src/cloud-sync.js"></script>
    <script src="./src/main.js"></script>
  </body>
</html>
